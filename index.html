<!doctype html>
<html lang="en"> 
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mazzaratti - Booking Kit</title>
  <meta name="description" content="Mobile booking kit: videos, song list, and contact in one place." />
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#111111" />

  <style>
    :root { --bg:#0b0b0d; --card:#15151a; --text:#f4f4f5; --muted:#a1a1aa; --accent:#22c55e; --line:#27272a; }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
    a{color:inherit}
    .wrap{max-width:720px;margin:0 auto;padding:18px 14px 80px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:12px;border-radius:12px;border:1px solid var(--line);
      background:#101015;text-decoration:none;font-weight:600;min-width:120px
    }
    .btn.primary{background:var(--accent);color:#041006;border-color:transparent}
    .btn.small{padding:10px;min-width:auto}
    .muted{color:var(--muted);font-size:.95rem;line-height:1.35}
    h2{font-size:1.1rem;margin:0 0 10px}
    .tag{display:inline-block;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.85rem}
    .list{margin:0;padding-left:18px}
    .song{padding:10px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#0f0f14}
    .song b{display:block}

    /* Logo */
    .logo-wrap{display:flex;justify-content:center;margin-bottom:6px}
    .band-logo{max-width:260px;width:100%;height:auto;display:block}

    /* PHOTO GRID */
    .photo-grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap:8px;
    }
    .photo-tile{
      aspect-ratio:1/1;
      border-radius:12px;
      overflow:hidden;
      border:1px solid var(--line);
      background:#0f0f14;
      display:block;
    }
    .photo-tile img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .footer{
      position:fixed;left:0;right:0;bottom:0;
      background:rgba(11,11,13,.92);
      backdrop-filter:blur(10px);
      border-top:1px solid var(--line);
      padding:10px 14px
    }
    .footer .wrap{padding:0;max-width:720px}

    .inline-link{text-decoration:underline;text-underline-offset:2px}
    .inline-link:hover{opacity:.9}

    /* Modal */
    .modal{
      position:fixed; inset:0;
      background:rgba(0,0,0,.6);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:9999;
    }
    .modal.show{display:flex}
    .modal-card{
      width:min(720px,100%);
      max-height:80vh;
      overflow:auto;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
    }
    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .modal-body{
      white-space:pre-wrap;
      line-height:1.45;
    }
  </style>
</head>

<body>
<div class="wrap">

<div class="card">
  <div class="logo-wrap">
    <img src="Assets/LOGO_SM.png" alt="Mazzaratti" class="band-logo">
  </div>

  <div class="tag" id="tagline">Playing The Songs That People Forgot They Loved!</div>

  <div class="row" style="margin-top:12px">
    <a class="btn primary" id="callBtn" href="#">Call</a>
    <a class="btn" id="textBtn" href="#">Text</a>
    <a class="btn" id="emailBtn" href="#">Email</a>
    <a class="btn" id="bioBtn" href="#">Band Bio</a>
  </div>

  <div class="muted" style="margin-top:10px">
    Booking contact:
    <span id="contactName">Tom</span> •
    <a id="contactPhone" class="inline-link" href="#">(414) 870-0554</a> •
    <a id="contactEmail" class="inline-link" href="#">mazzarattirocks@gmail.com</a>
  </div>
</div>

<div class="card">
  <h2>Photos</h2>
  <div class="photo-grid" id="photoGrid">

    <a class="photo-tile" href="Assets/Live.jpg" target="_blank">
      <img src="Assets/Live.jpg" alt="Live show">
    </a>

    <a class="photo-tile" href="Assets/Table.jpg" target="_blank">
      <img src="Assets/Table.jpg" alt="Band at table">
    </a>

    <a class="photo-tile" href="Assets/Team.jpg" target="_blank">
      <img src="Assets/Team.jpg" alt="Team">
    </a>

    <a class="photo-tile" href="Assets/Live2.jpg" target="_blank">
      <img src="Assets/Live2.jpg" alt="Live 2">
    </a>

    <a class="photo-tile" href="Assets/Dave.jpg" target="_blank">
      <img src="Assets/Dave.jpg" alt="Dave">
    </a>

  </div>
  <p class="muted" style="margin-top:10px">Tap any photo to open full size.</p>
</div>

</div>

<div class="footer">
  <div class="wrap">
    <div class="row">
      <a class="btn small" id="shareBtn" href="#">Share</a>
      <a class="btn small" id="copyLinkBtn" href="#">Copy link</a>
      <a class="btn small" id="fbBtn" href="#">Facebook</a>
      <a class="btn small" id="igBtn" href="#">Instagram</a>
    </div>
  </div>
</div>

</body>
</html>
